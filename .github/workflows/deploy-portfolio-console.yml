name: Deploy Portfolio Console Lambdas

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_REGION: eu-west-2
      PORTFOLIO_DASHBOARD_LAMBDA_FUNCTION_NAME: sports-stat-arb-portfolio-dashboard
      PORTFOLIO_RECONCILER_LAMBDA_FUNCTION_NAME: sports-stat-arb-portfolio-reconciler
      LAMBDA_DEPLOY_BUCKET: ${{ secrets.LAMBDA_DEPLOY_BUCKET }}
      ODDS_S3_BUCKET: ${{ secrets.ODDS_S3_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials
        if: ${{ env.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Lambda packages
        run: |
          rm -rf /tmp/portfolio_dashboard_package /tmp/portfolio_reconciler_package
          rm -f /tmp/portfolio_dashboard.zip /tmp/portfolio_reconciler.zip

          mkdir -p /tmp/portfolio_dashboard_package/exchange_scanner
          cp exchange_scanner/portfolio_dashboard.py /tmp/portfolio_dashboard_package/exchange_scanner/
          touch /tmp/portfolio_dashboard_package/exchange_scanner/__init__.py
          cp lambda_functions/portfolio_dashboard/lambda_function.py /tmp/portfolio_dashboard_package/lambda_function.py
          (cd /tmp/portfolio_dashboard_package && zip -r /tmp/portfolio_dashboard.zip .)

          mkdir -p /tmp/portfolio_reconciler_package/exchange_scanner
          python -m pip install --target /tmp/portfolio_reconciler_package httpx pydantic
          cp exchange_scanner/*.py /tmp/portfolio_reconciler_package/exchange_scanner/
          cp lambda_functions/portfolio_reconciler/lambda_function.py /tmp/portfolio_reconciler_package/lambda_function.py
          find /tmp/portfolio_reconciler_package -type d -name "__pycache__" -prune -exec rm -rf {} +
          (cd /tmp/portfolio_reconciler_package && zip -r /tmp/portfolio_reconciler.zip .)

      - name: Deploy portfolio dashboard
        run: |
          deploy_bucket="${LAMBDA_DEPLOY_BUCKET:-$ODDS_S3_BUCKET}"
          test -n "$deploy_bucket"
          test -n "$PORTFOLIO_DASHBOARD_LAMBDA_FUNCTION_NAME"
          deploy_key="lambda_deployments/portfolio-dashboard-${GITHUB_SHA}.zip"
          aws s3 cp /tmp/portfolio_dashboard.zip "s3://${deploy_bucket}/${deploy_key}"
          aws lambda update-function-code \
            --region "$AWS_REGION" \
            --function-name "$PORTFOLIO_DASHBOARD_LAMBDA_FUNCTION_NAME" \
            --s3-bucket "$deploy_bucket" \
            --s3-key "$deploy_key" \
            > /tmp/portfolio_dashboard_update.json
          aws lambda wait function-updated \
            --region "$AWS_REGION" \
            --function-name "$PORTFOLIO_DASHBOARD_LAMBDA_FUNCTION_NAME"
          aws lambda update-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$PORTFOLIO_DASHBOARD_LAMBDA_FUNCTION_NAME" \
            --handler lambda_function.lambda_handler \
            --runtime python3.11 \
            --timeout 30 \
            --memory-size 256 \
            > /tmp/portfolio_dashboard_config.json
          aws lambda wait function-updated \
            --region "$AWS_REGION" \
            --function-name "$PORTFOLIO_DASHBOARD_LAMBDA_FUNCTION_NAME"

      - name: Deploy account reconciler
        run: |
          deploy_bucket="${LAMBDA_DEPLOY_BUCKET:-$ODDS_S3_BUCKET}"
          test -n "$deploy_bucket"
          test -n "$PORTFOLIO_RECONCILER_LAMBDA_FUNCTION_NAME"
          deploy_key="lambda_deployments/portfolio-reconciler-${GITHUB_SHA}.zip"
          aws s3 cp /tmp/portfolio_reconciler.zip "s3://${deploy_bucket}/${deploy_key}"
          aws lambda update-function-code \
            --region "$AWS_REGION" \
            --function-name "$PORTFOLIO_RECONCILER_LAMBDA_FUNCTION_NAME" \
            --s3-bucket "$deploy_bucket" \
            --s3-key "$deploy_key" \
            > /tmp/portfolio_reconciler_update.json
          aws lambda wait function-updated \
            --region "$AWS_REGION" \
            --function-name "$PORTFOLIO_RECONCILER_LAMBDA_FUNCTION_NAME"
          aws lambda update-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$PORTFOLIO_RECONCILER_LAMBDA_FUNCTION_NAME" \
            --handler lambda_function.lambda_handler \
            --runtime python3.11 \
            --timeout 60 \
            --memory-size 256 \
            > /tmp/portfolio_reconciler_config.json
          aws lambda wait function-updated \
            --region "$AWS_REGION" \
            --function-name "$PORTFOLIO_RECONCILER_LAMBDA_FUNCTION_NAME"
