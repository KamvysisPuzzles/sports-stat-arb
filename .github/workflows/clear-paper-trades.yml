name: Clear Paper Trades

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE to clear every item from the paper trades DynamoDB table."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  clear:
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_REGION: eu-west-2
      STRATEGY_RUNNER_LAMBDA_FUNCTION_NAME: ${{ secrets.STRATEGY_RUNNER_LAMBDA_FUNCTION_NAME }}

    steps:
      - name: Confirm destructive action
        run: |
          if [ "${{ inputs.confirm }}" != "DELETE" ]; then
            echo "Confirmation did not match DELETE; refusing to clear table." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Clear DynamoDB paper trades via strategy runner
        run: |
          if [ -z "$STRATEGY_RUNNER_LAMBDA_FUNCTION_NAME" ]; then
            echo "Missing STRATEGY_RUNNER_LAMBDA_FUNCTION_NAME secret." >&2
            exit 1
          fi
          aws lambda invoke \
            --region "$AWS_REGION" \
            --function-name "$STRATEGY_RUNNER_LAMBDA_FUNCTION_NAME" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"mode":"clear-paper-trades"}' \
            /tmp/clear-paper-trades-response.json
          cat /tmp/clear-paper-trades-response.json
