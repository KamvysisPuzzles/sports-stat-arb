name: Deploy Strategy Runner Lambda

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_REGION: eu-west-2
      STRATEGY_RUNNER_LAMBDA_FUNCTION_NAME: ${{ secrets.STRATEGY_RUNNER_LAMBDA_FUNCTION_NAME }}
      LAMBDA_DEPLOY_BUCKET: ${{ secrets.LAMBDA_DEPLOY_BUCKET }}
      ODDS_S3_BUCKET: ${{ secrets.ODDS_S3_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials
        if: ${{ env.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Lambda package
        run: |
          rm -rf /tmp/strategy_runner_package /tmp/strategy_runner.zip
          mkdir -p /tmp/strategy_runner_package
          python -m pip install --upgrade pip
          python -m pip install --target /tmp/strategy_runner_package .
          cp lambda_functions/strategy_runner/lambda_function.py /tmp/strategy_runner_package/lambda_function.py
          find /tmp/strategy_runner_package -type d -name "__pycache__" -prune -exec rm -rf {} +
          (cd /tmp/strategy_runner_package && zip -r /tmp/strategy_runner.zip .)

      - name: Deploy Lambda package
        run: |
          deploy_bucket="${LAMBDA_DEPLOY_BUCKET:-$ODDS_S3_BUCKET}"
          if [ -z "$deploy_bucket" ]; then
            echo "Missing LAMBDA_DEPLOY_BUCKET or ODDS_S3_BUCKET secret." >&2
            exit 1
          fi
          if [ -z "$STRATEGY_RUNNER_LAMBDA_FUNCTION_NAME" ]; then
            echo "Missing STRATEGY_RUNNER_LAMBDA_FUNCTION_NAME secret." >&2
            exit 1
          fi
          deploy_key="lambda_deployments/strategy-runner-${GITHUB_SHA}.zip"
          aws s3 cp /tmp/strategy_runner.zip "s3://${deploy_bucket}/${deploy_key}"
          aws lambda update-function-code \
            --region "$AWS_REGION" \
            --function-name "$STRATEGY_RUNNER_LAMBDA_FUNCTION_NAME" \
            --s3-bucket "$deploy_bucket" \
            --s3-key "$deploy_key" \
            > /tmp/strategy_runner_update_code.json
          aws lambda wait function-updated \
            --region "$AWS_REGION" \
            --function-name "$STRATEGY_RUNNER_LAMBDA_FUNCTION_NAME"
          aws lambda update-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$STRATEGY_RUNNER_LAMBDA_FUNCTION_NAME" \
            --handler lambda_function.lambda_handler \
            --runtime python3.11 \
            --timeout 300 \
            --memory-size 1024 \
            > /tmp/strategy_runner_update_config.json
          aws lambda wait function-updated \
            --region "$AWS_REGION" \
            --function-name "$STRATEGY_RUNNER_LAMBDA_FUNCTION_NAME"
