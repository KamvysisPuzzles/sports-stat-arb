name: Paper Trade Log

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "paper-log, update-closing, or settle-results"
        required: true
        default: "paper-log"
        type: choice
        options:
          - paper-log
          - update-closing
          - settle-results

permissions:
  contents: write
  id-token: write

concurrency:
  group: paper-trade-log
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      PAPER_ALERT_WEBHOOK_URL: ${{ secrets.PAPER_ALERT_WEBHOOK_URL }}
      PAPER_DB: data/paper_trades.sqlite3
      SPORTS_PROFILE: active-h2h
      MAX_API_REQUESTS: "100"
      MAX_EDGE: "0.10"
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      BETFAIR_LAMBDA_FUNCTION_NAME: ${{ secrets.BETFAIR_LAMBDA_FUNCTION_NAME }}
      BETFAIR_LAMBDA_REGION: eu-west-2
      MARKET_DB: /tmp/market_snapshots.sqlite3
      ODDS_S3_BUCKET: ${{ secrets.ODDS_S3_BUCKET }}
      ODDS_S3_PREFIX: odds_snapshots

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Ensure data directory
        run: mkdir -p data

      - name: Scan exchange CLV signals
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'paper-log') || github.event.schedule == '0 * * * *' }}
        run: |
          scan-exchanges \
            --strategy exchange-clv \
            --sports-profile "$SPORTS_PROFILE" \
            --markets h2h,h2h_lay,totals,spreads \
            --max-api-requests "$MAX_API_REQUESTS" \
            --min-edge 0.015 \
            --max-edge "$MAX_EDGE" \
            --min-reference-books 1 \
            --max-age-seconds 900 \
            --max-event-days 4 \
            --store-odds-snapshot \
            --market-db "$MARKET_DB" \
            --unique-bets \
            > data/latest_opportunities.csv

      - name: Add Matchbook liquidity
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'paper-log') || github.event.schedule == '0 * * * *' }}
        run: |
          python scripts/enrich_matchbook_liquidity.py \
            --input-csv data/latest_opportunities.csv \
            --output-csv data/latest_opportunities_with_matchbook_liquidity.csv \
            --currency GBP \
            --minimum-liquidity 2

      - name: Configure AWS credentials
        id: aws-credentials
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.mode == 'paper-log') || github.event.schedule == '0 * * * *') && env.AWS_ROLE_ARN != '' && (env.BETFAIR_LAMBDA_FUNCTION_NAME != '' || env.ODDS_S3_BUCKET != '') }}
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.BETFAIR_LAMBDA_REGION }}

      - name: Store odds snapshot in S3
        id: store-odds-snapshot
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.mode == 'paper-log') || github.event.schedule == '0 * * * *') && steps.aws-credentials.outcome == 'success' && env.ODDS_S3_BUCKET != '' }}
        continue-on-error: true
        run: |
          odds_snapshot_outputs=/tmp/odds_snapshot_outputs
          python scripts/export_odds_snapshot_parquet.py \
            --market-db "$MARKET_DB" \
            --output-dir /tmp/odds_snapshot_export \
            --s3-prefix "$ODDS_S3_PREFIX" \
            --github-output "$odds_snapshot_outputs"
          . "$odds_snapshot_outputs"
          aws s3 cp \
            "$local_path" \
            "s3://${ODDS_S3_BUCKET}/${s3_key}"
          cat "$odds_snapshot_outputs" >> "$GITHUB_OUTPUT"

      - name: Deploy Betfair enrichment Lambda
        id: deploy-betfair-lambda
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.mode == 'paper-log') || github.event.schedule == '0 * * * *') && steps.aws-credentials.outcome == 'success' && env.BETFAIR_LAMBDA_FUNCTION_NAME != '' }}
        continue-on-error: true
        run: |
          rm -rf /tmp/betfair_lambda_package /tmp/betfair_lambda.zip
          mkdir -p /tmp/betfair_lambda_package
          python -m pip install --target /tmp/betfair_lambda_package httpx
          cp -R exchange_scanner /tmp/betfair_lambda_package/
          cp lambda_functions/betfair_enrichment/lambda_function.py /tmp/betfair_lambda_package/lambda_function.py
          (cd /tmp/betfair_lambda_package && zip -r /tmp/betfair_lambda.zip .)
          aws lambda update-function-code \
            --region "$BETFAIR_LAMBDA_REGION" \
            --function-name "$BETFAIR_LAMBDA_FUNCTION_NAME" \
            --zip-file fileb:///tmp/betfair_lambda.zip \
            > /tmp/betfair_lambda_update_code.json
          aws lambda wait function-updated \
            --region "$BETFAIR_LAMBDA_REGION" \
            --function-name "$BETFAIR_LAMBDA_FUNCTION_NAME"
          aws lambda update-function-configuration \
            --region "$BETFAIR_LAMBDA_REGION" \
            --function-name "$BETFAIR_LAMBDA_FUNCTION_NAME" \
            --handler lambda_function.lambda_handler \
            --timeout 120 \
            > /tmp/betfair_lambda_update_config.json
          aws lambda wait function-updated \
            --region "$BETFAIR_LAMBDA_REGION" \
            --function-name "$BETFAIR_LAMBDA_FUNCTION_NAME"
          echo "BETFAIR_LAMBDA_READY=1" >> "$GITHUB_ENV"

      - name: Add Betfair liquidity
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'paper-log') || github.event.schedule == '0 * * * *' }}
        run: |
          if [ "$BETFAIR_LAMBDA_READY" = "1" ]; then
            python scripts/invoke_betfair_lambda.py \
              --function-name "$BETFAIR_LAMBDA_FUNCTION_NAME" \
              --region "$BETFAIR_LAMBDA_REGION" \
              --input-csv data/latest_opportunities_with_matchbook_liquidity.csv \
              --output-csv data/latest_opportunities_with_liquidity.csv
          else
            echo "Betfair Lambda is unavailable; using local fallback without Betfair credentials."
            python scripts/enrich_betfair_liquidity.py \
              --input-csv data/latest_opportunities_with_matchbook_liquidity.csv \
              --output-csv data/latest_opportunities_with_liquidity.csv
          fi

      - name: Log trades
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'paper-log') || github.event.schedule == '0 * * * *' }}
        run: |
          python scripts/log_exchange_paper_trades.py \
            --paper-db "$PAPER_DB" \
            --opportunities-csv data/latest_opportunities_with_liquidity.csv \
            --paper-stake 1 \
            --inserted-count-out data/latest_inserted.txt

      - name: Update closing values
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'update-closing') || github.event.schedule == '30 */2 * * *' }}
        run: |
          scan-exchanges \
            --strategy exchange-clv \
            --paper-db "$PAPER_DB" \
            --paper-update-closing \
            --sports-profile "$SPORTS_PROFILE" \
            --markets h2h,h2h_lay,totals,spreads \
            --max-api-requests "$MAX_API_REQUESTS" \
            --max-event-days 7 \
            --min-edge -999 \
            --min-reference-books 1 \
            --max-age-seconds 900

      - name: Settle recent results
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'settle-results') || github.event.schedule == '45 */6 * * *' }}
        run: |
          scan-exchanges \
            --paper-db "$PAPER_DB" \
            --paper-settle-results \
            --scores-days-from 3

      - name: Export trade log
        run: |
          scan-exchanges --paper-db "$PAPER_DB" --paper-export > data/paper_trades.csv
          [ -f data/latest_opportunities_with_liquidity.csv ] || touch data/latest_opportunities_with_liquidity.csv
          [ -f data/latest_inserted.txt ] || echo 0 > data/latest_inserted.txt

      - name: Build summary
        run: |
          python scripts/paper_alert_summary.py \
            --title "Paper Trade Log Summary" \
            --paper-csv data/paper_trades.csv \
            --opportunities-csv data/latest_opportunities_with_liquidity.csv \
            --new-trades-count-file data/latest_inserted.txt \
            --opportunity-dedupe-key event-market-outcome \
            --scan-kind price \
            --markdown-out data/paper_summary.md \
            --text-out data/paper_summary.txt
          cat data/paper_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Send webhook alert
        if: ${{ env.PAPER_ALERT_WEBHOOK_URL != '' }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          webhook_url = os.environ["PAPER_ALERT_WEBHOOK_URL"]
          text = open("data/paper_summary.txt", encoding="utf-8").read()
          payload = json.dumps({"text": text, "content": text}).encode("utf-8")
          request = urllib.request.Request(
              webhook_url,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              print(f"Webhook response: {response.status}")
          PY

      - name: Commit trade log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper_trades.sqlite3 data/paper_trades.csv data/paper_summary.md
          if git diff --cached --quiet; then
            echo "No paper-trade changes to commit."
          else
            git commit -m "Update paper trade log"
            git push
          fi
