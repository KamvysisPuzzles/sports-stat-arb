[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matchbook-clv-scanner"
version = "0.1.0"
description = "Paper-trade Matchbook h2h value bets against weighted reference prices."
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
scan-exchanges = "exchange_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["exchange_scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
